{% extends "base.html" %}
{% block contenido %}

<h1>Ajedrez</h1>
<p>Turno: <span id="turno">Blancas</span></p>
<p id="estado"></p>

<div id="tablero" style="width: 480px; margin: 20px 0;"></div>

<div style="display: flex; gap: 10px; margin-bottom: 20px;">
  <label for="dificultad">Dificultad IA:</label>
  <select id="dificultad">
    <option value="2">Fácil</option>
    <option value="6" selected>Medio</option>
    <option value="12">Difícil</option>
    <option value="20">Experto</option>
  </select>
  <button onclick="reiniciar()">Reiniciar</button>
  <button onclick="toggleModo()">Modo: <span id="modo-label">2 jugadores</span></button>
</div>

<h3>Movimientos</h3>
<div id="historial" style="font-family: monospace; font-size: 13px; max-height: 200px; overflow-y: auto; border: 1px solid #ddd; padding: 10px; max-width: 480px;"></div>

<!-- Librerías -->
<link rel="stylesheet"
  href="https://cdnjs.cloudflare.com/ajax/libs/chessboard-js/1.0.0/chessboard-1.0.0.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/chessboard-js/1.0.0/chessboard-1.0.0.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
<script src="{{ url_for('static', filename='stockfish.js') }}"></script>

<script>
  var juego = new Chess();
  var modoIA = false;
  var historialMovimientos = [];

  var tablero = Chessboard('tablero', {
    draggable: true,
    position: 'start',
    onDragStart: onDragStart,
    onDrop: onDrop,
    onSnapEnd: onSnapEnd,
    pieceTheme: 'https://chessboardjs.com/img/chesspieces/wikipedia/{piece}.png'
  });

  function onDragStart(source, piece) {
    if (juego.game_over()) return false;
    if (modoIA && juego.turn() === 'b') return false;
    if (juego.turn() === 'w' && piece.search(/^b/) !== -1) return false;
    if (juego.turn() === 'b' && piece.search(/^w/) !== -1) return false;
  }

  function onDrop(source, target) {
    var movimiento = juego.move({
      from: source,
      to: target,
      promotion: 'q'
    });

    if (movimiento === null) return 'snapback';

    registrarMovimiento(movimiento);
    actualizarEstado();

    if (modoIA && !juego.game_over() && juego.turn() === 'b') {
      setTimeout(moverIA, 400);
    }
  }

  function onSnapEnd() {
    tablero.position(juego.fen());
  }

  var motor = new Worker("{{ url_for('static', filename='stockfish.js') }}");
  motor.postMessage('uci');

  motor.onmessage = function(evento) {
    var mensaje = evento.data;
    if (mensaje.startsWith('bestmove')) {
      var partes = mensaje.split(' ');
      var mejor = partes[1];
      if (mejor && mejor !== '(none)') {
        var movimiento = juego.move({
          from: mejor.substring(0, 2),
          to: mejor.substring(2, 4),
          promotion: mejor.length > 4 ? mejor[4] : 'q'
      });
      if (movimiento) {
        tablero.position(juego.fen());
        registrarMovimiento(movimiento);
        actualizarEstado();
      }
    }
  }
};

  function moverIA() {
    var nivel = parseInt(document.getElementById('dificultad').value);
    motor.postMessage('position fen ' + juego.fen());
    motor.postMessage('go depth ' + nivel);
  }
  function registrarMovimiento(mov) {
    historialMovimientos.push(mov.san);
    var num = Math.ceil(historialMovimientos.length / 2);
    var div = document.getElementById('historial');
    if (historialMovimientos.length % 2 === 1) {
      div.innerHTML += '<span>' + num + '. ' + mov.san + ' </span>';
    } else {
      div.innerHTML += '<span>' + mov.san + '</span><br>';
    }
    div.scrollTop = div.scrollHeight;
  }

  function actualizarEstado() {
    var turnoEl = document.getElementById('turno');
    var estadoEl = document.getElementById('estado');

    if (juego.in_checkmate()) {
      var ganador = juego.turn() === 'w' ? 'Negras' : 'Blancas';
      estadoEl.textContent = '¡Jaque mate! Ganan ' + ganador;
      turnoEl.textContent = '—';
      guardarPartida(ganador.toLocaleLowerCase());
    } else if (juego.in_draw()) {
      estadoEl.textContent = 'Empate';
      turnoEl.textContent = '—';
      guardarPartida('empate');
    } else if (juego.in_check()) {
      turnoEl.textContent = juego.turn() === 'w' ? 'Blancas' : 'Negras';
      estadoEl.textContent = '¡Jaque!';
    } else {
      turnoEl.textContent = juego.turn() === 'w' ? 'Blancas' : 'Negras';
      estadoEl.textContent = '';
    }
  }

  function guardarPartida(resultado){
    var datos = {
      modo : modoIA ? 'vs_ia' : '2jugadores',
      dificultad : modoIA ? parseInt(document.getElementById('dificultad').value) : null,
      resultado : resultado,
      movimientos : historialMovimientos.join(' ')
    };

    fetch('/ajedrez/guardar',{
      method:"POST",
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(datos)
    })

  }

  function reiniciar() {
    juego.reset();
    tablero.start();
    historialMovimientos = [];
    document.getElementById('historial').innerHTML = '';
    document.getElementById('turno').textContent = 'Blancas';
    document.getElementById('estado').textContent = '';
  }

  function toggleModo() {
    modoIA = !modoIA;
    document.getElementById('modo-label').textContent = modoIA ? 'vs IA' : '2 jugadores';
    reiniciar();
  }
</script>

{% endblock %}
