{% extends "base.html" %}
{% block contenido %}
<h1>Editar nota</h1>
<form method="POST" action="{{ url_for('notas.editar_nota', nota_id=nota.id) }}">
    <input type="text" name="titulo" value="{{ nota.titulo }}" required>
    <textarea name="contenido" rows="5" required>{{ nota.contenido }}</textarea>
    <button type="submit">Guardar cambios</button>
</form>
<a href="{{ url_for('notas.ver_notas') }}">Cancelar</a>
{% endblock %}
